{% extends "base.html" %}
{% load static %}

{% block title %}Login | Oneblade{% endblock %}


{% block content %}

<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Ingresar</h2>

    {% if messages %}
        {% for message in messages  %}
            <div class="p-3 mb-4 text-center rounded-lg border-l-4 text-sm
                {% if message.tags == 'error' %}border-red-500 bg-red-50 text-red-700
                {% else %}border-green-500 bg-green-50 text-green-700{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method=POST>
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Usuario</label>
            <input type="text" name="username" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-light transition-all duration-200" placeholder="Tu Usuario">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Contraseña</label>
            <input type="password" name="password" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-light transition-all duration-200" placeholder="Tu Contraseña">
        </div>

        <button type="submit" class="w-full py-2.5 rounded-lg text-white font-semibold text-sm transition-all duration-200 hover:bg-primary-dark active:scale-95 bg-primary">Ingresar
        </button>

        <p class="text-center text-sm text-gray-500 mt-4">
            ¿Aun no tienes una cuenta?
            <a href="{% url "users:register" %}" class="text-primary font-semibold hover:underline">Registrate</a>
        </p>
    </form>
</div>




{% endblock content %}
